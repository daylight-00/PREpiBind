# Boltz-1 embedding backend. The fork exposes single and pair representations and bypasses diffusion.
[project]
name = "prepibind-emb-boltz"
version = "1.0.0"
requires-python = "==3.12.*"
dependencies = [
    "boltz @ git+https://github.com/daylight-00/boltz.git@c68fdf48f79859b16428ef7fc800a699ddff0be6",
    "torch==2.6.0",   # what the environment that produced our embeddings actually had
    "h5py",
    "pandas",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "==3.12.9"
